name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Weekdays at 21:30 UTC, shortly after the US close year-round: 16:30 ET
    # under EST (close 21:00 UTC) and 17:30 ET under EDT (close 20:00 UTC).
    # GitHub runs scheduled jobs late under load — observed ~17 minutes here —
    # which still lands well after the bell either way.
    # Weekends are excluded: nothing closes, so there is nothing to pick up.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed dataset
  pages: write      # publish to Pages
  id-token: write   # OIDC token deploy-pages needs

# Never let a scheduled refresh and a push deploy race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh market data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Test parsing logic
        run: python3 scripts/test_fetch_logic.py

      # Skipped on push — a code change shouldn't burn API calls.
      - name: Fetch latest figures
        if: github.event_name != 'push'
        env:
          # SEC policy asks automated clients to identify a contact address.
          # Held as a secret so the address is not readable from a public repo.
          # Optional: without it EDGAR is skipped and the other providers carry
          # the run.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python3 scripts/fetch_data.py --fail-under 60

      - name: Validate dataset
        run: python3 scripts/validate_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/companies.json; then
            echo "No change in market data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          git commit -m "Refresh market data ($(date -u +%Y-%m-%d))"

          # The fetch takes minutes, so main can move under us — a push landing
          # meanwhile makes this non-fast-forward. Rebase onto whatever is there
          # and retry rather than losing the refresh.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Pushed refreshed data on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; refetching main and retrying."
            sleep 5
          done
          echo "Could not push refreshed data after 3 attempts." >&2
          exit 1

  deploy:
    name: Deploy to Pages
    needs: refresh
    # A failed refresh must not take the site down with it. When the data
    # provider is unreachable the map should stay published with the last
    # good figures; the run still goes red so the failure is visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicitly take main so we publish the commit the refresh job just
      # pushed, not the older SHA that triggered this run.
      - uses: actions/checkout@v4
        with:
          ref: main

      # enablement lets the workflow turn Pages on itself via the API, so the
      # first deploy doesn't need anyone to flip Settings -> Pages by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
